<html>
<head>
  <base href=".">
  <meta charset="UTF-8">
  <title>3D Grid MMORPG World</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="placed-blocks.js"></script>
  <script src="placed-assets.js"></script>
  <script src="assets.js"></script>
  <script src="block-tools.js"></script>
</head>
<body>
  <div id="editor-container">
    <div id="grid-container">
    </div>
  </div>

  <script>
    // Add div removal observer
    const divRemovalObserver = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.addedNodes.length) {
          // Check for divs added to bottom of body
          const lastElement = document.body.lastElementChild;
          if (lastElement && lastElement.tagName === 'DIV' && 
              !['editor-container', 'grid-container'].includes(lastElement.id)) {
            lastElement.style.display = 'none'; // Hide the div
            // Optional: remove instead of hide
            // lastElement.remove();
          }
        }
      });
    });

    // Start observing body for changes
    divRemovalObserver.observe(document.body, {
      childList: true,
      subtree: true
    });

    let room = new WebsimSocket();
    let peers = {};
    let scene, camera, renderer, controls;
    let gridBlocks = {};
    let groundPlane;
    let loadedModels = [];
    let placedAssets = [];
    const loader = new THREE.GLTFLoader();

    let player = {
      position: new THREE.Vector3(0, 1, 0), // Initial Y will be updated after level load
      indicator: null,
      targetPosition: new THREE.Vector3(0, 1, 0), // Initial Y will be updated
      moving: false,
      speed: 0.1 // Increased speed
    };
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let isDragging = false;
    let dragStart = new THREE.Vector2();
    let cameraOffset = new THREE.Vector3(0, 15, 8); // More top-down, slightly back for perspective

    function init() {
      scene = new THREE.Scene();
      
      // Add skybox
      const skyboxGeometry = new THREE.BoxGeometry(1000, 1000, 1000);
      const skyboxMaterial = new THREE.MeshBasicMaterial({
        color: 0x87CEEB, // Light sky blue
        side: THREE.BackSide
      });
      const skybox = new THREE.Mesh(skyboxGeometry, skyboxMaterial);
      scene.add(skybox);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('grid-container').appendChild(renderer.domElement);
      
      // Set initial camera position to follow player
      updateCameraPosition();
      
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;  
      controls.dampingFactor = 0.05;
      controls.enabled = false; // Disable orbit controls for manual drag

      // Add player indicator
      // Initial player Y position might change after level load, so we'll update it then.
      player.position.set(0, 0, 0); // Start at 0,0,0 temporarily
      player.targetPosition.copy(player.position);
      createPlayerIndicator();

      // Add event listeners for click-to-move and camera drag
      setupInputHandlers();

      // Ground plane
      const groundGeometry = new THREE.PlaneGeometry(32, 32);
      const groundMaterial = new THREE.MeshBasicMaterial({
        visible: false, 
        side: THREE.DoubleSide
      });
      groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.set(0, 0, 0);
      scene.add(groundPlane);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 20, 10);
      scene.add(directionalLight);

      window.addEventListener('resize', onWindowResize);

      // Load level data
      fetch('level.json')
        .then(response => response.json())
        .then(levelData => {
          loadLevel(levelData);
          // Update player's Y position based on loaded level
          const initialPlayerGroundY = getGroundYAt(player.position.x, player.position.z);
          player.position.y = initialPlayerGroundY;
          player.targetPosition.y = initialPlayerGroundY;
          if (player.indicator) {
            player.indicator.position.y = initialPlayerGroundY;
          }
          updateCameraPosition(); // Update camera after player Y is set
        })
        .catch(error => {
          console.error('Error loading level:', error);
        });
    }

    function updateCameraPosition() {
      const targetPos = player.position.clone().add(cameraOffset);
      camera.position.copy(targetPos);
      camera.lookAt(player.position);
    }

    function createPlayerIndicator() {
      // Create oval indicator for player
      const geometry = new THREE.RingGeometry(0.3, 0.4, 16);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x00ff00, 
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7
      });
      player.indicator = new THREE.Mesh(geometry, material);
      player.indicator.rotation.x = -Math.PI / 2;
      player.indicator.position.copy(player.position);
      scene.add(player.indicator);
    }

    function setupInputHandlers() {
      let mouseDownTime = 0;
      let clickThreshold = 200; // milliseconds

      renderer.domElement.addEventListener('mousedown', (event) => {
        mouseDownTime = Date.now();
        dragStart.set(event.clientX, event.clientY);
        isDragging = false;
      });

      renderer.domElement.addEventListener('mousemove', (event) => {
        if (mouseDownTime > 0) { // Check if mouse button is held down
          const dragDistance = Math.sqrt(
            Math.pow(event.clientX - dragStart.x, 2) + 
            Math.pow(event.clientY - dragStart.y, 2)
          );
          
          if (dragDistance > 5 || isDragging) { // Start dragging if moved enough, or continue if already dragging
            isDragging = true;
            
            const deltaX = event.clientX - dragStart.x;
            const deltaY = event.clientY - dragStart.y;
            
            const rotationSpeed = 0.005; 
            const zoomSpeed = 0.05;    

            // Horizontal drag rotates camera around player
            const angle = -deltaX * rotationSpeed;
            const cosAngle = Math.cos(angle);
            const sinAngle = Math.sin(angle);
            
            const newX = cameraOffset.x * cosAngle - cameraOffset.z * sinAngle;
            const newZ = cameraOffset.x * sinAngle + cameraOffset.z * cosAngle;
            
            cameraOffset.x = newX;
            cameraOffset.z = newZ;

            // Vertical drag adjusts camera height (zoom)
            cameraOffset.y += deltaY * zoomSpeed;
            cameraOffset.y = Math.max(5, Math.min(30, cameraOffset.y));

            updateCameraPosition();
            
            // Send camera direction to parent
            const direction = Math.atan2(cameraOffset.x, cameraOffset.z) * 180 / Math.PI;
            const normalizedDirection = ((direction % 360) + 360) % 360;
            if (window.parent !== window) {
              window.parent.postMessage({
                type: 'cameraDirection',
                direction: normalizedDirection
              }, '*');
            }
            
            dragStart.set(event.clientX, event.clientY);
          }
        }
      });

      renderer.domElement.addEventListener('mouseup', (event) => {
        const clickDuration = Date.now() - mouseDownTime;
        
        if (!isDragging && clickDuration < clickThreshold) {
          // Handle click-to-move
          handleClickToMove(event);
        }
        
        mouseDownTime = 0;
        isDragging = false;
      });
    }

    function handleClickToMove(event) {
      // Calculate mouse position in normalized device coordinates
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      // Cast ray from camera through mouse position
      raycaster.setFromCamera(mouse, camera);
      
      // Check intersection with ground plane
      const intersects = raycaster.intersectObject(groundPlane);
      
      if (intersects.length > 0) {
        const clickPos = intersects[0].point;
        
        // Determine target grid cell
        const targetGridX = Math.round(clickPos.x);
        const targetGridZ = Math.round(clickPos.z);

        // Clamp to grid bounds
        const clampedGridX = Math.max(-15, Math.min(15, targetGridX));
        const clampedGridZ = Math.max(-15, Math.min(15, targetGridZ));
        
        // Get ground Y at the target cell
        const targetGroundY = getGroundYAt(clampedGridX, clampedGridZ);
        
        player.targetPosition.set(clampedGridX, targetGroundY, clampedGridZ);
        player.moving = true;
      }
    }

    function updatePlayer() {
      if (player.moving) {
        const direction = player.targetPosition.clone().sub(player.position);
        const distance = direction.length();
        
        if (distance < 0.1) {
          player.position.copy(player.targetPosition);
          player.moving = false;
        } else {
          direction.normalize().multiplyScalar(player.speed);
          player.position.add(direction);
        }
        
        // Ensure player indicator follows precisely, especially Y position
        player.indicator.position.copy(player.position); 
        updateCameraPosition(); // Camera follows player smoothly
      }
    }

    function getGroundYAt(gridCoordX, gridCoordZ) {
      let groundSurfaceY = 0; // Default ground level if no blocks (Y=0 is the base plane)
      let highestBlockBaseY = -Infinity;
      let topBlockData = null;

      // Find the highest block at the given X, Z coordinates
      for (const key in gridBlocks) {
        const block = gridBlocks[key];
        // Block positions are stored as integer grid coords in their keys
        const [bx, by, bz] = key.split(',').map(Number);

        if (bx === gridCoordX && bz === gridCoordZ) {
          if (by > highestBlockBaseY) {
            highestBlockBaseY = by;
            topBlockData = block.userData;
          }
        }
      }

      if (topBlockData) {
        const blockType = topBlockData.blockType;
        // Base of the block is at Y = highestBlockBaseY
        // Player stands on top of this block
        if (blockType === 'full') {
          groundSurfaceY = highestBlockBaseY + 1.0; // Top surface of a full block (1 unit high)
        } else if (blockType === 'stair' || blockType === 'half') {
          groundSurfaceY = highestBlockBaseY + 0.5; // Top surface of stair/half block (0.5 units high)
        } else {
          // Default for unknown block types, assume half block height
          groundSurfaceY = highestBlockBaseY + 0.5;
        }
      }
      // If no block found, groundSurfaceY remains 0 (the base ground plane).
      return groundSurfaceY;
    }

    function loadLevel(levelData) {
      // Clear existing scene
      Object.keys(gridBlocks).forEach(key => removeBlock(key));
      gridBlocks = {};
      placedAssets.forEach(asset => scene.remove(asset.model));
      placedAssets = [];

      // Load blocks
      levelData.blocks?.forEach(block => {
        const newBlock = addBlock(new THREE.Vector3(block.x, block.y, block.z), block.type || 'half');
        if (block.orientation) {
          let rotation = 0;
          switch (block.orientation) {
            case 'east':
              rotation = Math.PI / 2;
              break;
            case 'south':
              rotation = Math.PI;
              break;
            case 'west':
              rotation = -Math.PI / 2;
              break;
          }
          newBlock.rotation.y = rotation;
          newBlock.userData.orientation = block.orientation;
        }
        if (block.color) {
          newBlock.material.color.set('#' + block.color);
        }
        if (block.textureUrl) {
          const textureLoader = new THREE.TextureLoader();
          textureLoader.load(block.textureUrl, texture => {
            texture.userData = { url: block.textureUrl };
            newBlock.material.map = texture;
            newBlock.material.needsUpdate = true;
          });
        }
        gridBlocks[`${block.x},${block.y},${block.z}`] = newBlock;
      });

      // Load assets
      levelData.assets?.forEach(assetData => {
        loader.load(assetData.url, gltf => {
          const model = gltf.scene;
          model.position.set(assetData.position.x, assetData.position.y, assetData.position.z);
          model.rotation.set(assetData.rotation.x, assetData.rotation.y, assetData.rotation.z);
          model.scale.set(assetData.scale.x, assetData.scale.y, assetData.scale.z);
          model.userData.url = assetData.url;
          model.userData.name = assetData.name;
          scene.add(model);
          placedAssets.push({
            id: assetData.id,
            model: model,
            position: model.position.clone(),
            url: assetData.url,
            name: assetData.name
          });
        });
      });
    }

    function addBlock(position, blockType = 'half') {
      let geometry;
      switch (blockType) {
        case 'full':
          geometry = new THREE.BoxGeometry(1, 1, 1);
          break;
        case 'stair':
          geometry = createStairGeometry();
          break;
        default:
          geometry = new THREE.BoxGeometry(1, 0.5, 1);
      }

      const material = new THREE.MeshPhongMaterial({ color: 0x8888ff });
      const block = new THREE.Mesh(geometry, material);
      block.userData.blockType = blockType;

      const adjustedX = position.x + 0.5;
      const adjustedY = position.y + (blockType === 'full' ? 0.5 : 
                                    blockType === 'half' ? 0.25 : 
                                    blockType === 'stair' ? 0.25 : 0.25);
      const adjustedZ = position.z + 0.5;

      block.position.set(adjustedX, adjustedY, adjustedZ);
      block.userData.key = `${position.x},${position.y},${position.z}`;
      
      scene.add(block);
      return block;
    }

    function createStairGeometry() {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        -0.5, 0.0, 0.5,   0.5, 0.0, 0.5,   0.5, 0.25, 0.5,  -0.5, 0.25, 0.5,
        -0.5, 0.0, -0.5,  0.5, 0.0, -0.5,  0.5, 0.25, -0.5, -0.5, 0.25, -0.5,
        -0.5, 0.25, 0.5,  0.0, 0.25, 0.5,  0.0, 0.5, 0.5,   -0.5, 0.5, 0.5,
        -0.5, 0.25, -0.5, 0.0, 0.25, -0.5, 0.0, 0.5, -0.5,  -0.5, 0.5, -0.5
      ]);
      const indices = new Uint16Array([
        0, 1, 2,    0, 2, 3,    4, 5, 6,    4, 6, 7,
        0, 4, 7,    0, 7, 3,    1, 5, 6,    1, 6, 2,
        3, 2, 6,    3, 6, 7,    0, 1, 5,    0, 5, 4,
        8, 9, 10,   8, 10, 11,  12, 13, 14, 12, 14, 15,
        8, 12, 15,  8, 15, 11,  9, 13, 14,  9, 14, 10,
        11, 10, 14, 11, 14, 15, 8, 9, 13,   8, 13, 12
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));
      geometry.computeVertexNormals();
      return geometry;
    }

    function removeBlock(key) {
      scene.children.forEach(child => {
        if (child.userData.key === key) {
          scene.remove(child);
          delete gridBlocks[key];
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      updatePlayer();

      controls.update();
      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
